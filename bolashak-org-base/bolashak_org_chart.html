<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: transparent; color: #1a1a1a; }
  h2.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  .controls { display: flex; gap: 8px; padding: 10px 12px; align-items: center; border-bottom: 1px solid #e5e5e5; flex-wrap: wrap; }
  .controls button { padding: 4px 10px; border: 1px solid #d0d0d0; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; color: #333; transition: background 0.15s; }
  .controls button:hover { background: #f0f0f0; }
  .legend { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #555; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .tree-container { overflow: auto; padding: 16px; height: calc(100vh - 60px); }
  .node-wrap { display: inline-flex; align-items: flex-start; }
  .node { display: inline-flex; flex-direction: column; align-items: flex-start; border: 1.5px solid #e0e0e0; border-radius: 7px; padding: 6px 10px; min-width: 180px; max-width: 220px; background: #fff; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; position: relative; margin: 3px 0; }
  .node:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.12); border-color: #bbb; }
  .node.head { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .node.head .role { color: #aaa; }
  .node.exec { background: #2d4a7a; color: #fff; border-color: #2d4a7a; }
  .node.exec .role { color: #9ab; }
  .node.dept-head { border-left: 3px solid; }
  .node.outsource { border: 1.5px dashed #9b59b6; background: #faf5ff; }
  .name { font-size: 12px; font-weight: 600; line-height: 1.3; }
  .role { font-size: 10.5px; color: #666; line-height: 1.3; margin-top: 1px; }
  .node.head .role, .node.exec .role { color: #9ab; }
  .badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .badge { font-size: 9.5px; padding: 1px 5px; border-radius: 3px; font-weight: 500; }
  .badge.pt { background: #fff3cd; color: #856404; }
  .badge.ft { background: #d1edff; color: #0a58ca; }
  .badge.vacancy { background: #ffe0e0; color: #b30000; }
  .badge.outsource { background: #ede9fe; color: #7c3aed; }
  .badge.sub { background: #e8f5e9; color: #2e7d32; }
  .children-container { margin-left: 20px; border-left: 1.5px dashed #ddd; padding-left: 12px; margin-top: 2px; }
  .child-row { display: flex; align-items: flex-start; margin: 2px 0; }
  .child-row::before { content: ''; display: block; width: 10px; height: 1.5px; background: #ddd; margin-top: 16px; flex-shrink: 0; }
  .toggle-btn { position: absolute; right: 6px; top: 6px; font-size: 10px; color: #aaa; background: none; border: none; cursor: pointer; line-height: 1; }
  .dept-it { border-left-color: #6366f1; }
  .dept-marketing { border-left-color: #ec4899; }
  .dept-commercial { border-left-color: #f59e0b; }
  .dept-accounting { border-left-color: #10b981; }
  .dept-security { border-left-color: #ef4444; }
  .dept-hr { border-left-color: #8b5cf6; }
  .dept-rc { border-left-color: #0ea5e9; }
  .dept-store { border-left-color: #84cc16; }
  .stats-bar { font-size: 11px; color: #666; padding: 4px 12px 6px; border-bottom: 1px solid #f0f0f0; }
</style>

let nodeId = 0;
const states = {};
function initStates(node) {
  node._id = nodeId++;
  states[node._id] = node.collapsed !== undefined ? node.collapsed : false;
  if (node.children) node.children.forEach(initStates);
}
initStates(data);

function renderNode(node) {
  const id = node._id;
  const isCollapsed = states[id];
  const hasChildren = node.children && node.children.length > 0;
  let typeClass = node.type === 'head' ? 'head' : node.type === 'exec' ? 'exec' : node.type === 'outsource' ? 'outsource' : node.type === 'dept-head' ? 'dept-head ' + (node.dept || '') : '';
  let badges = '';
  if (node.pt) badges += '<span class="badge pt">PT</span>';
  if (node.ft && !['head','exec','dept-head','outsource'].includes(node.type)) badges += '<span class="badge ft">FT</span>';
  if (node.sub) badges += '<span class="badge sub">Замена кассира</span>';
  if (node.outsource) badges += '<span class="badge outsource">Аутсорс · FinPark</span>';
  if (node.vacancy) badges += '<span class="badge vacancy">Вакансия</span>';
  if (badges) badges = `<div class="badges">${badges}</div>`;
  const toggleBtn = hasChildren ? `<button class="toggle-btn" onclick="toggle(${id},event)">${isCollapsed?'▶':'▼'}</button>` : '';
  let childrenHtml = '';
  if (hasChildren && !isCollapsed) {
    childrenHtml = `<div class="children-container">${node.children.map(c=>`<div class="child-row">${renderNode(c)}</div>`).join('')}</div>`;
  }
  return `<div class="node-wrap"><div><div class="node ${typeClass}" onclick="toggle(${id},event)" title="${node.name}">${toggleBtn}<div class="name">${node.name}</div><div class="role">${node.role}</div>${badges}</div>${childrenHtml}</div></div>`;
}

function toggle(id, event) {
  event.stopPropagation();
  const node = findNode(data, id);
  if (node && node.children && node.children.length) { states[id] = !states[id]; render(); }
}
function findNode(node, id) {
  if (node._id === id) return node;
  if (node.children) for (const c of node.children) { const f = findNode(c,id); if(f) return f; }
  return null;
}
function setAllStates(node, val) {
  if (node.children && node.children.length) { states[node._id] = val; node.children.forEach(c=>setAllStates(c,val)); }
}
function expandAll() { setAllStates(data, false); render(); }
function collapseAll() { data.children && data.children.forEach(c=>setAllStates(c,true)); render(); }
function render() { document.getElementById('tree').innerHTML = renderNode(data); }
render();
